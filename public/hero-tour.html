<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<title>Hero Tour</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<style type="text/css" title="Default">
			html { height:100%; }
			body {
				height:100%;
				margin: 0px;
				background: #050505;
				color: white;
				overflow:hidden;
			}
			/* Hide all skin UI elements except the custom hotspots (which use class .ggskin_hotspot) */
			.ggskin:not(.ggskin_hotspot):not(.ggskin_hotspot *) {
				display: none !important;
			}
			/* Hide default Pano2VR red hotspots (SVGs) just in case */
			#container > svg {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<script type="text/javascript" src="https://mania3d-assets.web.app/output/pano2vr_player.js"></script>
		<div id="container" style="width:100%;height:100%;overflow:hidden;"></div>
		<script type="text/javascript">
			var pano = new pano2vrPlayer("container");
			if (pano.setBasePath) pano.setBasePath("https://mania3d-assets.web.app/output/");
			
			// Load config without skin to remove all labels, skins, and UI
			window.addEventListener("load", function() {
				pano.readConfigUrlAsync("https://mania3d-assets.web.app/output/pano.xml");
			});

			// Intercept mouse wheel events before Pano2VR gets them
			// This prevents zooming and allows the browser to scroll the main parent page instead
			window.addEventListener('wheel', function(e) {
				e.stopPropagation();
			}, true);
		</script>
	</body>
</html>
